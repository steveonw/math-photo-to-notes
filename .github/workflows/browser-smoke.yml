name: Browser smoke tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: node tests/browser-smoke.mjs

      - name: Fetch pinned MathJax tex-svg bundle
        run: python3 scripts/fetch_mathjax.py --output vendor/mathjax/tex-svg.js

      - name: Build single-file offline edition
        run: python3 make_offline_build.py photo_to_text.html vendor/mathjax/tex-svg.js --output photo_to_text_OFFLINE.html

      - name: Run browser smoke tests against offline edition
        run: APP_FILE=photo_to_text_OFFLINE.html node tests/browser-smoke.mjs
